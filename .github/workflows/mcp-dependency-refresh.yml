name: Refresh MCP transitive dependency

on:
  push:
    branches: [fix/mcp-audit-2026-10]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-audit-2026-10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched MCP dependency
        run: npm update @modelcontextprotocol/server --package-lock-only --ignore-scripts
      - name: Verify patched version
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/@modelcontextprotocol/server']?.version; console.log('MCP server',v); if(!v || v.localeCompare('2.3.0',undefined,{numeric:true})<0) process.exit(1)"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update transitive MCP server dependency"
          git push
